# MIC Smart Campus Supabase Configuration
project_id = "mic-smart-campus"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "io.supabase.miccampus://login-callback/"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "52428800" # 50MiB
image_transformation = { enabled = true }

[realtime]
enabled = true
ip_version = "v4"
